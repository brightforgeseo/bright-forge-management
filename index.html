<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bright Forge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f97316" />
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <link rel="apple-touch-icon" href="./assets/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Bright Forge Portal</title>
    <!-- Build trigger: v1 -->
    <script>
      // Polyfill process.env for browser environments
      window.process = window.process || {};
      window.process.env = window.process.env || {};

      // Paid browser-side AI keys are intentionally not stored in the portal.
      // Echo requests must go through the local Hermes bridge instead.
      const paidAiKeyName = String.fromCharCode(65,78,84,72,82,79,80,73,67,95,65,80,73,95,75,69,89);
      localStorage.removeItem(paidAiKeyName);
    </script>

    <!-- Tailwind is compiled at build time via PostCSS -->
    <!-- Import map removed - Parcel bundles all dependencies -->
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Safe area insets for iOS notch/home indicator */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
    </style>
  <link rel="stylesheet" href="./styles.css">
</head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
