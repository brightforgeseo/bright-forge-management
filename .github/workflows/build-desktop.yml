name: Build Desktop & Mobile Apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || '' }}

jobs:
  get-release-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Get release tag
        id: get_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

  build-mac:
    needs: get-release-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build && npx electron-builder --mac --publish never

      - name: List dist contents
        run: ls -la dist/

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.dmg dist/*.zip dist/latest-mac.yml dist/*.blockmap; do
            [ -f "$f" ] && gh release upload "${{ needs.get-release-tag.outputs.tag }}" "$f" --clobber || echo "Skipping $f"
          done

  build-win:
    needs: get-release-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build && npx electron-builder --win --publish never

      - name: List dist contents
        run: dir dist

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in dist/*.exe dist/latest.yml dist/*.blockmap; do
            [ -f "$f" ] && gh release upload "${{ needs.get-release-tag.outputs.tag }}" "$f" --clobber || echo "Skipping $f"
          done

  build-android:
    needs: get-release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BrightForgePortal-${{ steps.version.outputs.VERSION }}-android.apk

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.get-release-tag.outputs.tag }}" android/app/build/outputs/apk/debug/BrightForgePortal-${{ steps.version.outputs.VERSION }}-android.apk --clobber
